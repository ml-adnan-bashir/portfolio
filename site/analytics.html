<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Portfolio analytics · Adnan Bashir</title>
<style>
*{box-sizing:border-box}body{background:#101014;color:#f6f2ea;font:16px/1.55 system-ui;margin:0}main{max-width:940px;margin:8vh auto;padding:0 5vw}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2rem,6vw,4rem);margin:.3em 0}a{color:#f4c4ad}button,input{font:inherit;padding:.55em .85em;border-radius:5px;border:1px solid #888}button{cursor:pointer;background:#f4c4ad;color:#191719}label{display:block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.65em 0;border-bottom:1px solid #49464d}td small{display:block;color:#bcbac1;overflow-wrap:anywhere}td:last-child,th:last-child{text-align:right}#totals{font-size:1.3rem}#status{color:#f4c4ad}footer{margin-top:3rem}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}.metric{border-top:1px solid #555;padding:.75rem 0}.metric strong{display:block;font:2rem Georgia,serif}.bar{display:block;height:.45rem;margin-top:.36rem;background:#f4c4ad;border-radius:4px}.chart{margin-bottom:1rem}.chart div{margin:.6rem 0;overflow-wrap:anywhere}#refresh{margin-right:.5rem}#tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:1.4rem}#tables section{border-top:1px solid #5b5555}.chart{padding-left:1.8rem}.chart li{padding:.55rem 0;overflow-wrap:anywhere}.chart li::marker{color:#bcaba4}.chart strong{float:right;margin-left:.5rem;font-variant-numeric:tabular-nums}.chart .bar{clear:both}#tables section:nth-child(2) .bar{background:#a5bdd9}#tables section:nth-child(3) .bar{background:#9fcab7}body{background:radial-gradient(ellipse at 85% 0,#182c35,transparent 50%),#0c1015}main{max-width:1120px}#tables{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}#tables section{padding:clamp(16px,2.4vw,30px);border:1px solid #35414b;border-radius:18px;background:linear-gradient(140deg,#1a242e,#121920)}#tables h2{margin:0 0 1.2rem;font-size:1.65rem}.distribution{display:grid;grid-template-columns:minmax(95px,1fr) minmax(110px,1.1fr);gap:16px;align-items:center}.wheel{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative}.wheel:before{content:'';position:absolute;inset:18%;border-radius:50%;background:#172029}.wheel strong{position:relative;font:600 clamp(16px,2vw,28px) system-ui}.legend button{border:0;background:transparent;color:#eff7fc;display:flex;align-items:center;gap:7px;text-align:left;width:100%;padding:5px 2px;font-size:.85rem}.legend button:before{content:'';background:var(--swatch);width:9px;height:9px;border-radius:50%;flex:none}.legend span{overflow-wrap:anywhere}.legend b{margin-left:auto}.legend button:hover,.legend button:focus{color:var(--swatch)}.metric strong{font:500 clamp(3.4rem,7vw,6rem)/1.05 Georgia;color:#80e3ce}.chart li{padding:.4rem 0}.chart .bar{position:relative;height:3px;background:#80e3ce!important}.chart .bar:after{content:'';position:absolute;right:0;top:-3px;width:9px;height:9px;border-radius:50%;background:#80e3ce}#tables section:last-child .bar,#tables section:last-child .bar:after{background:#ff9770!important}@media(max-width:760px){#tables{grid-template-columns:1fr}.wheel{max-width:190px;width:100%}}</style></head><body><main><a href="index.html">Adnan Bashir · Portfolio</a><h1>Portfolio analytics</h1>
<form id="login"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required> <button>View analytics</button></form><p id="status" role="status"></p>
<section id="report" hidden><div id="totals" class="metrics"></div><p><button id="refresh">Refresh</button> <button id="lock">Lock</button></p><div id="tables"></div></section>
</main><script>
const byId = id => document.getElementById(id);
function shortName(target) {
  const url = new URL(target);
  const parts = url.pathname.split('/').filter(Boolean);
  let name = parts.pop() || url.hostname.split('.').filter(x => x !== 'www')[0];
  if (/^index\.html?$/i.test(name)) name = parts.pop() || 'Home';
  name = name.replace(/\.(html?|pdf|ipynb|zip|csv)$/i,'');
  if (/^activity\d+$/i.test(name)) name = (parts.pop() || '') + name.replace(/activity/i,'A');
  if (name === 'site' || name === 'portfolio') return 'Home';
  if (/^pcc26_11$/i.test(name)) return 'PCC26';
  try { name = decodeURIComponent(name); } catch {}
  return name.split(/[^\p{L}\p{N}]+/u).filter(Boolean).map(word => word[0].toUpperCase()+word.slice(1)).join('') || 'Link';
}
const palette = ['#80e3ce','#ff9770','#b4a1ff','#ffd475','#86bdff','#758298'];
function share(title, rows) {
  const panel = document.createElement('section'), heading = document.createElement('h2');
  heading.textContent = title; panel.append(heading);
  const ordered = [...rows].sort((a,b)=>b.n-a.n || a.target.localeCompare(b.target));
  const total = ordered.reduce((sum,row)=>sum+row.n,0);
  if (!total) { panel.append('No activity'); return panel; }
  const slices = ordered.slice(0,5).map(row=>({name:shortName(row.target),n:row.n}));
  if (ordered.length>5) slices.push({name:'Other',n:ordered.slice(5).reduce((sum,row)=>sum+row.n,0)});
  const layout=document.createElement('div'), wheel=document.createElement('div'), center=document.createElement('strong'), legend=document.createElement('div');
  layout.className='distribution'; wheel.className='wheel'; legend.className='legend';
  center.textContent=total.toLocaleString(); wheel.append(center);
  let angle=0;
  const stops=slices.map(({name,n},i)=>{
    const start=angle; angle+=360*n/total;
    const button=document.createElement('button'), label=document.createElement('span'), number=document.createElement('b');
    button.type='button'; button.style.setProperty('--swatch',palette[i]);
    label.textContent=name; number.textContent=n.toLocaleString();
    button.append(label,number); legend.append(button);
    const percent=(100*n/total).toLocaleString(undefined,{maximumFractionDigits:1})+'%';
    button.title=name+' · '+percent;
    const select=()=>{center.textContent=percent;center.style.color=palette[i]};
    const reset=()=>{center.textContent=total.toLocaleString();center.style.color=''};
    button.onmouseenter=button.onfocus=button.onclick=select;
    button.onmouseleave=button.onblur=reset;
    return palette[i]+' '+start+'deg '+angle+'deg';
  });
  wheel.style.background='conic-gradient('+stops.join(',')+')';
  layout.append(wheel,legend);panel.append(layout);return panel;
}
function ranking(title, rows, ascending = false) {
  const section = document.createElement('section'), heading = document.createElement('h2');
  heading.textContent = title;
  section.append(heading);
  const ranked = [...rows].sort((a,b) => (ascending ? a.n-b.n : b.n-a.n) || a.target.localeCompare(b.target)).slice(0,5);
  const scale = Math.max(1,...ranked.map(row=>row.n));
  const chart = document.createElement('ol');
  chart.className = 'chart';
  for (const row of ranked) {
    const item = document.createElement('li'), value = document.createElement('strong'), bar = document.createElement('span');
    item.append(shortName(row.target));
    value.textContent = row.n.toLocaleString();
    bar.className = 'bar'; bar.style.width = (100*row.n/scale)+'%';
    item.append(value,bar); chart.append(item);
  }
  section.append(ranked.length ? chart : '—');
  return section;
}
const api = 'https://portfolio-visit-reports.ml-adnan-bashir.chatgpt.site/report';
const key = 'portfolio-report-session';
function lock() {
  sessionStorage.removeItem(key);
  byId('report').hidden = true; byId('login').hidden = false;
  byId('totals').replaceChildren(); byId('tables').replaceChildren();
}
async function update(fields) {
  const button = byId('login').querySelector('button');
  button.disabled = byId('refresh').disabled = true;
  byId('status').textContent = 'Loading…';
  try {
    const response = await fetch(api,{method:'POST',body:new URLSearchParams(fields),credentials:'omit',cache:'no-store'});
    if (response.status === 401) { lock(); throw new Error(fields.session ? 'Session expired. Sign in again.' : 'Incorrect password.'); }
    if (!response.ok) throw new Error(response.status === 429 ? 'Too many attempts. Try again in 15 minutes.' : 'Unable to load counts. Please try again.');
    const {rows,session} = await response.json();
    if (session) sessionStorage.setItem(key,session);
    const pages = rows.filter(r => r.kind === 'page'), links = rows.filter(r => r.kind === 'link');
    const sum = list => list.reduce((n,r) => n+r.n,0);
    const historical = 1704;
    const metrics = [['Visits', historical + sum(pages)]];
    byId('totals').replaceChildren(...metrics.map(([name,n]) => {
      const box = document.createElement('div'), value = document.createElement('strong');
      box.className = 'metric'; value.textContent = n.toLocaleString(); box.append(value,name); return box;
    }));
    byId('tables').replaceChildren(share('Visit share',pages),share('Click share',links),ranking('Most visited',pages),ranking('Least visited',pages,true));
    byId('status').textContent = 'Updated '+new Date().toLocaleTimeString();
    byId('login').hidden = true; byId('report').hidden = false;
  } catch(error) { byId('status').textContent = error.message; }
  finally { button.disabled = byId('refresh').disabled = false; }
}
byId('login').onsubmit = event => {
  event.preventDefault(); const password = byId('pw').value; event.currentTarget.reset(); update({password});
};
byId('refresh').onclick = () => update({session:sessionStorage.getItem(key)});
byId('lock').onclick = () => {
  const session = sessionStorage.getItem(key);
  lock(); byId('status').textContent = '';
  fetch(api,{method:'POST',body:new URLSearchParams({session,action:'logout'}),credentials:'omit'}).catch(()=>{});
};
if (sessionStorage.getItem(key)) update({session:sessionStorage.getItem(key)});
</script></body></html>
