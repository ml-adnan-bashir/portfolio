<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Portfolio analytics · Adnan Bashir</title>
<style>
*{box-sizing:border-box}body{background:#101014;color:#f6f2ea;font:16px/1.55 system-ui;margin:0}main{max-width:940px;margin:8vh auto;padding:0 5vw}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(2rem,6vw,4rem);margin:.3em 0}a{color:#f4c4ad}button,input{font:inherit;padding:.55em .85em;border-radius:5px;border:1px solid #888}button{cursor:pointer;background:#f4c4ad;color:#191719}label{display:block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.65em 0;border-bottom:1px solid #49464d}td small{display:block;color:#bcbac1;overflow-wrap:anywhere}td:last-child,th:last-child{text-align:right}#totals{font-size:1.3rem}#status{color:#f4c4ad}footer{margin-top:3rem}
</style></head><body><main><a href="index.html">Adnan Bashir · Portfolio</a><h1>Portfolio analytics</h1>
<form id="login"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required> <button>View analytics</button></form><p id="status" role="status"></p>
<section id="report" hidden><p id="totals"></p><div id="tables"></div><button id="lock">Lock dashboard</button><footer>Page visits include repeat opens and refreshes. Detailed counts start when tracking is enabled.</footer></section>
</main><script>
const byId = id => document.getElementById(id);
function ranking(title, rows) {
  const section = document.createElement('section');
  const heading = document.createElement('h2');
  heading.textContent = title;
  section.append(heading);
  if (!rows.length) { section.append('No activity recorded yet.'); return section; }
  const table = document.createElement('table');
  const head = table.createTHead().insertRow();
  for (const name of ['Destination','Count']) { const cell = document.createElement('th'); cell.textContent = name; head.append(cell); }
  const body = table.createTBody();
  for (const row of rows) {
    const tr = body.insertRow(), cell = tr.insertCell();
    cell.textContent = row.label || row.target;
    if (row.label) { const path = document.createElement('small'); path.textContent = row.target; cell.append(path); }
    tr.insertCell().textContent = row.n.toLocaleString();
  }
  section.append(table); return section;
}
byId('login').onsubmit = async event => {
  event.preventDefault();
  const form = event.currentTarget, button = form.querySelector('button');
  const body = new URLSearchParams({password:byId('pw').value});
  form.reset(); button.disabled = true; byId('status').textContent = 'Loading…';
  try {
    const response = await fetch('https://portfolio-visit-reports.ml-adnan-bashir.chatgpt.site/report',{method:'POST',body,credentials:'omit',cache:'no-store'});
    if (!response.ok) throw new Error(response.status === 401 ? 'Incorrect password.' : response.status === 429 ? 'Too many attempts. Try again in 15 minutes.' : 'The report is unavailable. Try again.');
    const {rows} = await response.json();
    const pages = rows.filter(r => r.kind === 'page'), links = rows.filter(r => r.kind === 'link');
    const sum = list => list.reduce((n,r) => n+r.n,0).toLocaleString();
    byId('totals').textContent = sum(pages)+' page visits · '+sum(links)+' direct link clicks';
    byId('tables').replaceChildren(ranking('Most viewed pages',pages),ranking('Most clicked links',links));
    byId('status').textContent = ''; form.hidden = true; byId('report').hidden = false;
  } catch (error) { byId('status').textContent = error.message; }
  finally { button.disabled = false; }
};
byId('lock').onclick = () => location.reload();
</script></body></html>
