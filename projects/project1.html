<script id="payload" type="application/json">{"salt":"CRqbjtD4GkK1CS3dcy+ybg==","iv":"XzkBFjrTm9LTFQTA","data":"80Hqrhv3Pv0np/luMDCf4VzXux2c4es5I0wydRIQ2MX8kfwQFSNgCQ0gS2xv5DJNuow9Y/Rn/64Bhm+3cn1vKYaWiyihlM6JlsTxS8BLLO8obKv2QL+ZIxuxXDeNiHPXeL3T3eHklJbFVIlBYLtTaah2rLqUbYR8OCDdtLhG2wKygUi8yYNTLLHqa/rJisKx2QfJ9POmu2afwXnxMA7odhg8vfDnNlJkkHE3wuXEZOVi09HNpYjk+UEClr3UVIs/F9jWTPNSw3+va6W92trLpHnwTO89fhoeUMSmM9FAsih61qzoV5WlOKpEdvjDikdhQf6TuklwhDxl/FFMzxxBhvlW7Ksc6GOMhFhGKI+wq+pQ/L1OC6/BwRzdDmwcO1i7PcC36KTgIhHoGhFJBbCqYvJmsbk7/h5/UpOzJ/UiFhmfjHxrqpk2mJLbgBV64hbvises2jI+1GkQLUZ8ST31sUHPRzJpliEkplhbj2PdSgPcHYVcwvc+duNjrnevtaeuSiunEvWbnwN1EMYSHebUJT21qOBix2MsVjLUOe1cMzVQFFsFBkJzqX9lwVu/Zt/h17mfJ+d+agn4VFlgEyLrDp0uPPHQUIlUAOpYgHD1fBNExNtk0rNs/Fg2II+8N7eMt6ZUx/nX"}</script>
<script>
const packet=JSON.parse(document.querySelector('#payload').textContent);
const view=document.querySelector('#view'), statusLine=document.querySelector('#status');
const encode=a=>btoa(Array.from(new Uint8Array(a),b=>String.fromCharCode(b)).join(''));
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(password,salt){
 const seed=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},seed,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function setup(){
 view.innerHTML='<p>Prepare your participant page. Enter the workshop details, choose a password, and download the finished file.</p><form><label for="title">Workshop title</label><input id="title" required><label for="body">Agenda, instructions, and resource links</label><textarea id="body" required></textarea><label for="pw">Participant password (at least 12 characters)</label><input id="pw" type="password" minlength="12" required autocomplete="new-password"><button>Download participant page</button></form>';
 document.querySelector('#title').value='Flagged and Curious';
 document.querySelector('#body').value='Workshop agenda\n\n0–10 min · Inspect a sample of connection timestamps. What catches your eye?\n\n10–35 min · Calculate the time between consecutive connections. Plot the gaps and identify one recurring pattern.\n\n35–50 min · Compare your candidate with routine scheduled traffic. What evidence would help distinguish them?\n\n50–60 min · Share one finding, one alternative explanation, and one question for further investigation.';
 view.querySelector('form').onsubmit=async e=>{
 e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;
 try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const key=await keyFor(document.querySelector('#pw').value,salt);
 const content=JSON.stringify([document.querySelector('#title').value,document.querySelector('#body').value]);
 const encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(content));
 const root=document.documentElement.cloneNode(true);root.querySelector('#view').replaceChildren();root.querySelector('#status').textContent='';
 root.querySelector('#payload').textContent=JSON.stringify({salt:encode(salt),iv:encode(iv),data:encode(encrypted)});
 const url=URL.createObjectURL(new Blob(['<!doctype html>\n',root.outerHTML],{type:'text/html'}));
 const link=document.createElement('a');link.href=url;link.download='project1.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),60000);
 statusLine.textContent='Participant copy created. Upload the downloaded copy as projects/project1.html.';
 }catch{statusLine.textContent='Download failed. Open this file in Chrome locally or over HTTPS and try again.'}finally{button.disabled=false}
 };
}
function lock(){
 document.querySelector('h1').textContent='Workshop room';statusLine.textContent='';
 view.innerHTML='<p>Enter the password shared by your instructor to open the workshop materials.</p><form><label for="pw">Workshop password</label><input id="pw" type="password" required autocomplete="off"><button>Enter workshop</button></form>';
 view.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;
 try{const key=await keyFor(document.querySelector('#pw').value,decode(packet.salt));
 const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(packet.iv)},key,decode(packet.data));
 const [title,body]=JSON.parse(new TextDecoder().decode(raw));document.querySelector('h1').textContent=title;
 view.innerHTML='<section id="notes"></section><button>Lock workshop</button>';const notes=view.querySelector('#notes');
 for(const part of body.split(/(https?:\/\/[^\s<>]+)/g)){if(/^https?:\/\//.test(part)){const a=document.createElement('a');a.href=part;a.textContent=part;a.target='_blank';a.rel='noopener noreferrer';notes.append(a)}else notes.append(part)}
 view.querySelector('button').onclick=lock;statusLine.textContent='';
 }catch{statusLine.textContent='Could not unlock the workshop. Check the password and try again.'}finally{button.disabled=false}
 };
}
if(packet)lock();else setup();
</script>
